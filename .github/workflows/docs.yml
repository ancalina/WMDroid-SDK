name: SDK documentation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: sdk/docs/package-lock.json
      - uses: actions/configure-pages@v5
      - run: npm ci
        working-directory: sdk/docs
      - run: npm run build
        working-directory: sdk/docs
        env:
          WMDROID_DOCS_BASE: /WMDroid-SDK/
          WMDROID_DOCS_SITE: https://ancalina.github.io
      - uses: actions/upload-pages-artifact@v3
        with:
          path: sdk/docs/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy documentation
        id: deployment
        uses: actions/deploy-pages@v4
